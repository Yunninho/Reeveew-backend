plugins {
    // Plugin "application": compila, empacota e permite executar com ./gradlew run
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

application {
    // Classe que contém o método main (pacote padrão)
    mainClass = 'Main'
    // Garante acentos e símbolos corretos no terminal (inclusive no Windows)
    applicationDefaultJvmArgs = ['-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8']
}

// Liga o teclado ao programa no ./gradlew run (sem isso o Scanner não recebe entrada)
run {
    standardInput = System.in
}

// Acentos e símbolos (♥, █, ╭) corretos na compilação
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Configuração da documentação gerada por ./gradlew javadoc
javadoc {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.author = true
    title = 'Reeveew'
}